  <text x="80" y="615" fill="#e4e4e7" font-family="sans-serif" font-weight="700" font-size="34">BLUETOOTH RC ROBOTIC VEHICLE</text>
  <text x="80" y="655" fill="#a1a1aa" font-family="monospace" font-size="18">ARDUINO • HC-05 BLUETOOTH SPP • L298N DUAL H-BRIDGE</text>
