  </defs>
  <rect width="1200" height="720" fill="url(#bg2)"/>
  <!-- Perspective Grid -->
  <g stroke="#6d28d9" stroke-opacity="0.22" stroke-width="1">
    <path d="M100 540 L1100 540 M200 460 L1000 460 M280 390 L920 390"/>
    <path d="M600 220 L120 640 M600 220 L360 640 M600 220 L600 640 M600 220 L840 640 M600 220 L1080 640"/>
  </g>
  <!-- Rover Chassis -->
  <g stroke="url(#mech)" stroke-width="3.5">
    <rect x="380" y="250" width="440" height="220" rx="24" fill="#0d0f1a" fill-opacity="0.9"/>
    <!-- 4 DC Geared Wheels -->
    <rect x="320" y="265" width="48" height="78" rx="10" fill="#171928" stroke="#f43f5e"/>
    <rect x="320" y="378" width="48" height="78" rx="10" fill="#171928" stroke="#f43f5e"/>
    <rect x="832" y="265" width="48" height="78" rx="10" fill="#171928" stroke="#f43f5e"/>
    <rect x="832" y="378" width="48" height="78" rx="10" fill="#171928" stroke="#f43f5e"/>
  </g>
  <!-- L298N H-Bridge & Arduino Core -->
  <rect x="440" y="295" width="140" height="130" rx="12" fill="#14182a" stroke="#38bdf8" stroke-width="2"/>
  <text x="462" y="365" fill="#38bdf8" font-family="monospace" font-size="18">MCU CORE</text>
  <rect x="620" y="295" width="140" height="130" rx="12" fill="#1b1224" stroke="#f43f5e" stroke-width="2"/>
  <text x="646" y="358" fill="#f43f5e" font-family="monospace" font-size="18">L298N</text>
  <text x="636" y="384" fill="#a1a1aa" font-family="monospace" font-size="13">PWM BRIDGE</text>
