  <g stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2">
    <circle cx="600" cy="180" r="32" stroke-dasharray="4 4"/>
    <circle cx="600" cy="180" r="58" stroke-opacity="0.35"/>
    <path d="M594 162 L610 176 L594 190 L594 162 M594 176 L610 190" stroke="#38bdf8" stroke-width="2.5"/>
